# ================================================================
# DataFlow360 / TerangaSafe — Stack complète
# ================================================================
#
# Démarrer tout (BDD + init/seed + API + frontend) :
#   docker compose up -d --build
#
# Profils optionnels :
#   docker compose --profile mlflow up -d --build     # + MLflow UI  (:5000)
#   docker compose --profile dev up -d --build        # + frontend Vite hot-reload (:5173)
#   docker compose --profile test run --rm api-tests  # tests unitaires API
#
# Utile :
#   docker compose ps                  # état + santé
#   docker compose logs -f api         # logs d'un service
#   docker compose down                # arrêt (données conservées)
#   docker compose down -v             # arrêt + SUPPRESSION des volumes
#
# Prérequis : Docker Compose v2.24+ (syntaxe env_file "required: false").
# ================================================================

name: dataflow360

# ----------------------------------------------------------------
# Blocs réutilisables (évite de répéter build / réseau / DATABASE_URL)
# ----------------------------------------------------------------
x-api-image: &api-image
  build:
    context: .comptes 
    dockerfile: api/Dockerfile
  image: dataflow360-api:latest
  networks:
    - dataflow360

x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-terangasafe}:${POSTGRES_PASSWORD:-terangasafe_pwd}@postgres:5432/${POSTGRES_DB:-terangasafe}

services:

  # ==============================================================
  # 1. PostgreSQL — base relationnelle (clients, transactions, alertes, crédits)
  # ==============================================================
  postgres:
    image: postgres:16-alpine
    container_name: dataflow360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terangasafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terangasafe_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-terangasafe}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"      # 5433 côté hôte : évite le conflit avec un Postgres local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terangasafe} -d ${POSTGRES_DB:-terangasafe}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - dataflow360

  # ==============================================================
  # 2. MongoDB — données semi-structurées (appareils, activités, historique)
  #    NB : pas encore consommé par l'API ; alimenté via src/data/load_mongodb.py
  # ==============================================================
  mongodb:
    image: mongo:7
    container_name: dataflow360-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-terangasafe}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-terangasafe_pwd}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-terangasafe}
    ports:
      - "${MONGO_PORT:-27018}:27017"       # 27018 = valeur par défaut de src/data/load_mongodb.py
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - dataflow360

  # ==============================================================
  # 3. Redis — cache / profils comportementaux précalculés (Sprint 4)
  #    NB : pas encore consommé par l'API.
  # ==============================================================
  redis:
    image: redis:7-alpine
    container_name: dataflow360-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - dataflow360

  # ==============================================================
  # 4. db-init — crée/migre le schéma, puis génère le jeu de démo
  #    UNIQUEMENT si les tables sont vides (idempotent). S'arrête ensuite.
  # ==============================================================
  db-init:
    <<: *api-image
    container_name: dataflow360-db-init
    command: ["python", "-m", "api.scripts.init_db"]
    environment:
      <<: *database-url
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ==============================================================
  # 5. API FastAPI  →  http://localhost:8000  (docs : /docs)
  # ==============================================================
  api:
    <<: *api-image
    container_name: dataflow360-api
    restart: unless-stopped
    environment:
      <<: *database-url
      APP_NAME: ${APP_NAME:-DataFlow360 API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}

      # MongoDB / Redis : prêts pour les évolutions (non lus par le code actuel)
      MONGO_URL: mongodb://${MONGO_USER:-terangasafe}:${MONGO_PASSWORD:-terangasafe_pwd}@mongodb:27017/${MONGO_DB:-terangasafe}?authSource=admin
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-terangasafe}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Le navigateur appelle l'API directement → origines du frontend autorisées
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000},http://localhost:5173,http://127.0.0.1:5173

      # Modèle de fraude (monté en lecture seule ci-dessous)
      FRAUD_MODEL_PATH: /app/models/fraude/modele_fraude_final.pkl
      FRAUD_MODEL_VERSION: ${FRAUD_MODEL_VERSION:-local}
      FRAUD_DECISION_THRESHOLD: ${FRAUD_DECISION_THRESHOLD:-0.5}

      # Modèle de crédit : aucun artefact livré → l'API répond en simulation
      CREDIT_MODEL_PATH: ${CREDIT_MODEL_PATH:-}
      CREDIT_MODEL_VERSION: ${CREDIT_MODEL_VERSION:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./models:/app/models:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==============================================================
  # 6. Frontend React (Vite + hot-reload)  →  http://localhost:3000
  #    Volume ./frontend monté : toute modif dans src/ se recharge seule.
  #    VITE_API_BASE_URL = URL de l'API vue PAR LE NAVIGATEUR.
  # ==============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: dataflow360-frontend-dev:latest
    container_name: dataflow360-frontend
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      FRONTEND_HMR_PORT: ${FRONTEND_PORT:-3000}
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - dataflow360

  # ==============================================================
  # 7. [optionnel] Build Nginx production (sans hot-reload)
  #    docker compose --profile prod-ui up -d --build frontend-prod
  # ==============================================================
  frontend-prod:
    profiles: ["prod-ui"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: dataflow360-frontend:latest
    container_name: dataflow360-frontend-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PROD_PORT:-3001}:80"
    networks:
      - dataflow360

  # ==============================================================
  # 8. [profil mlflow] MLflow UI  →  http://localhost:5000
  #    Suivi des expériences (models/fraude/modele_fraude_mlflow.py).
  # ==============================================================
  mlflow:
    profiles: ["mlflow"]
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install --no-cache-dir mlflow==3.16.1
    image: dataflow360-mlflow:latest
    container_name: dataflow360-mlflow
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=/mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - dataflow360

  # ==============================================================
  # 9. [profil test] Tests API — ISOLÉS : SQLite en mémoire, aucune
  #    connexion à PostgreSQL → ne peut pas toucher aux données de démo.
  # ==============================================================
  api-tests:
    <<: *api-image
    profiles: ["test"]
    container_name: dataflow360-api-tests
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      ENVIRONMENT: test
      SIMULATION_ENABLED: "true"
    command: ["pytest", "-q"]



  # ==============================================================
  # 10. Kafka + Zookeeper — détection de fraude temps réel
  # ==============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dataflow360-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - dataflow360

  kafka:
    image: apache/kafka:3.7.0
    container_name: terangasafe_kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "terangasafe-cluster-01"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - kafka_data:/var/lib/kafka/data


  transaction-producer:
    <<: *api-image
    container_name: dataflow360-transaction-producer
    restart: unless-stopped
    command: ["python", "-m", "api.kafka.producer"]
    environment:
      <<: *database-url
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_TRANSACTIONS: transactions
      KAFKA_ENABLED: "true"
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dataflow360

  fraud-consumer:
    <<: *api-image
    container_name: dataflow360-fraud-consumer
    restart: unless-stopped
    command: ["python", "-m", "api.kafka.consumer"]
    environment:
      <<: *database-url
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_TRANSACTIONS: transactions
      KAFKA_CONSUMER_GROUP: fraud-detection
      KAFKA_ENABLED: "true"
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dataflow360


volumes:
  postgres_data:
    name: dataflow360-postgres-data
  mongo_data:
    name: dataflow360-mongo-data
  mongo_config:
    name: dataflow360-mongo-config
  redis_data:
    name: dataflow360-redis-data
  mlflow_data:
    name: dataflow360-mlflow-data
  frontend_dev_node_modules:
    name: dataflow360-frontend-dev-node-modules
  kafka_data:
    name: dataflow360-kafka-data

networks:
  dataflow360:
    name: dataflow360-network
    driver: bridge