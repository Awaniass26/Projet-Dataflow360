
# TerangaSafe / DataFlow360 — Infrastructure de données
#
# 3 bases différentes, chacune choisie pour un usage précis :
#   - postgres : données structurées (clients, comptes, credits, remboursements, transactions)
#   - mongodb  : données semi-structurées / logs (appareils, activites, historique_etat_compte)
#   - redis    : profils comportementaux précalculés (Sprint 4, cache rapide)
#
# Démarrage : docker-compose up -d
# Arrêt     : docker-compose down            (les données persistent, grâce aux volumes)
# Reset complet : docker-compose down -v     (supprime aussi les volumes, tout est reperdu)

services:

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terangasafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terangasafe_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-terangasafe}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terangasafe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-terangasafe}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-terangasafe_pwd}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-terangasafe}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-terangasafe}:${POSTGRES_PASSWORD:-terangasafe_pwd}@postgres:5432/${POSTGRES_DB:-terangasafe}
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
    volumes:
      - ./models:/app/models:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  db-init:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "api.scripts.init_db"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-terangasafe}:${POSTGRES_PASSWORD:-terangasafe_pwd}@postgres:5432/${POSTGRES_DB:-terangasafe}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-tests:
    build:
      context: .
      dockerfile: api/Dockerfile
    profiles: ["test"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["pytest", "-q"]

volumes:
  postgres_data:
  mongo_data:
  redis_data: