version: "3.9"

# TerangaSafe / DataFlow360 — Infrastructure de données
#
# 3 bases différentes, chacune choisie pour un usage précis :
#   - postgres : données structurées (clients, comptes, credits, remboursements, transactions)
#   - mongodb  : données semi-structurées / logs (appareils, activites, historique_etat_compte)
#   - redis    : profils comportementaux précalculés (Sprint 4, cache rapide)
#
# Démarrage : docker-compose up -d
# Arrêt     : docker-compose down            (les données persistent, grâce aux volumes)
# Reset complet : docker-compose down -v     (supprime aussi les volumes, tout est reperdu)

services:

  postgres:
    image: postgres:16
    container_name: terangasafe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terangasafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terangasafe_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-terangasafe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terangasafe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: terangasafe_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-terangasafe}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-terangasafe_pwd}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-terangasafe}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: terangasafe_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


# --- À AJOUTER dans la section "services:" de ton docker-compose.yml existant ---
  kafka:
    image: apache/kafka:3.7.0
    container_name: terangasafe_kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "terangasafe-cluster-01"
    volumes:
      - kafka_data:/var/lib/kafka/data

# --- Et ajouter cette ligne dans la section "volumes:" existante, à côté de postgres_data/mongo_data/redis_data ---
#   kafka_data:

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:


