# ================================================================
# DataFlow360 / SenTerangaSafe — Stack complète
# ================================================================
#
# Démarrer tout :
#   docker compose up -d --build
#
# Profils optionnels :
#   docker compose --profile mlflow up -d --build
#   docker compose --profile test run --rm api-tests
#
# Utile :
#   docker compose ps
#   docker compose logs -f api
#   docker compose logs -f fraud-consumer
#   docker compose down
#   docker compose down -v   # ⚠️ supprime les volumes
# ================================================================

name: dataflow360

x-api-image: &api-image
  build:
    context: .
    dockerfile: api/Dockerfile
  image: dataflow360-api:latest
  networks:
    - dataflow360

x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-terangasafe}:${POSTGRES_PASSWORD:-terangasafe_pwd}@postgres:5432/${POSTGRES_DB:-terangasafe}

services:

  # ==============================================================
  # 1. PostgreSQL
  # ==============================================================
  postgres:
    image: postgres:16-alpine
    container_name: dataflow360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terangasafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terangasafe_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-terangasafe}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terangasafe} -d ${POSTGRES_DB:-terangasafe}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - dataflow360

  # ==============================================================
  # 2. MongoDB
  # ==============================================================
  mongodb:
    image: mongo:7
    container_name: dataflow360-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-terangasafe}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-terangasafe_pwd}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-terangasafe}
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_USER:-terangasafe}",
          "-p",
          "${MONGO_PASSWORD:-terangasafe_pwd}",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - dataflow360

  # ==============================================================
  # 3. Redis
  # ==============================================================
  redis:
    image: redis:7-alpine
    container_name: dataflow360-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - dataflow360

  # ==============================================================
  # 4. db-init
  # ==============================================================
  db-init:
    <<: *api-image
    container_name: dataflow360-db-init
    command: ["python", "-m", "api.scripts.init_db"]
    environment:
      <<: *database-url
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ==============================================================
  # 5. API FastAPI
  # ==============================================================
  api:
    <<: *api-image
    container_name: dataflow360-api
    restart: unless-stopped
    environment:
      <<: *database-url
      APP_NAME: ${APP_NAME:-DataFlow360 API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}

      MONGO_URL: mongodb://${MONGO_USER:-terangasafe}:${MONGO_PASSWORD:-terangasafe_pwd}@mongodb:27017/${MONGO_DB:-terangasafe}?authSource=admin
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-terangasafe}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379

      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000},http://localhost:5173,http://127.0.0.1:5173

      FRAUD_MODEL_PATH: /app/models/fraude/modele_fraude_final.pkl
      FRAUD_MODEL_VERSION: ${FRAUD_MODEL_VERSION:-local}
      FRAUD_DECISION_THRESHOLD: ${FRAUD_DECISION_THRESHOLD:-0.5}

      CREDIT_MODEL_PATH: /app/models/credit/modele_scoring_credit_final.pkl
      CREDIT_MODEL_VERSION: ${CREDIT_MODEL_VERSION:-local}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./models:/app/models:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==============================================================
  # 6. Frontend React (Vite dev)
  # ==============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: dataflow360-frontend-dev:latest
    container_name: dataflow360-frontend
    restart: unless-stopped
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      FRONTEND_HMR_PORT: ${FRONTEND_PORT:-3000}
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - dataflow360

  # ==============================================================
  # 7. [profil mlflow]
  # ==============================================================
  mlflow:
    profiles: ["mlflow"]
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install --no-cache-dir mlflow==3.16.1
    image: dataflow360-mlflow:latest
    container_name: dataflow360-mlflow
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=/mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - dataflow360

  # ==============================================================
  # 8. [profil test]
  # ==============================================================
  api-tests:
    <<: *api-image
    profiles: ["test"]
    container_name: dataflow360-api-tests
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      ENVIRONMENT: test
      SIMULATION_ENABLED: "true"
    command: ["pytest", "-q"]

  # ==============================================================
  # 9. Kafka (KRaft) — bus temps réel
  # ==============================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: dataflow360-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "terangasafe-cluster-01"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - dataflow360

  # ==============================================================
  # 10. Producer (Data Ing) — publie sur Kafka
  # ==============================================================
  transaction-producer:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    image: dataflow360-streaming:latest
    container_name: dataflow360-transaction-producer
    restart: unless-stopped
    command: ["python", "producer.py"]
    environment:
      KAFKA_HOST: kafka
      KAFKA_PORT: "19092"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-terangasafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terangasafe_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-terangasafe}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_BASE_URL: http://api:8000
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dataflow360

  # ==============================================================
  # 11. Consumer (Data Ing) — consomme Kafka → API
  # ==============================================================
  fraud-consumer:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    image: dataflow360-streaming:latest
    pull_policy: never
    container_name: dataflow360-fraud-consumer
    restart: unless-stopped
    command: ["python", "consumer.py"]
    environment:
      KAFKA_HOST: kafka
      KAFKA_PORT: "19092"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_BASE_URL: http://api:8000
      SERVICE_EMAIL: service-consumer@dataflow360.com
      SERVICE_PASSWORD: service-consumer-2026
    depends_on:
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - dataflow360

volumes:
  postgres_data:
    name: dataflow360-postgres-data
  mongo_data:
    name: dataflow360-mongo-data
  mongo_config:
    name: dataflow360-mongo-config
  redis_data:
    name: dataflow360-redis-data
  mlflow_data:
    name: dataflow360-mlflow-data
  frontend_dev_node_modules:
    name: dataflow360-frontend-dev-node-modules
  kafka_data:
    name: dataflow360-kafka-data

networks:
  dataflow360:
    name: dataflow360-network
    driver: bridge