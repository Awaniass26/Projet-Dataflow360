server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # React Router / SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ne pas mettre en cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets statiques
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

