name: CI DataFlow360

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier le code Python
        run: python -m compileall .
